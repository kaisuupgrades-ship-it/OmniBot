# The container logs of the OmniBot instances. `omnibot-instance setup` installs it as
# /etc/rsyslog.d/30-omnibot-docker.conf. See docs/docker.md#several-instances-on-one-host.
#
# Docker sends them to this socket and not to /dev/log, so they stay out of the journal and
# /var/log/syslog, whose size limits other services share. The AppArmor profile of rsyslogd permits a
# socket at /var/lib/*/dev/log. omnibot-logrotate keeps the files for 30 days.
template(name="OmnibotDockerFile" type="string" string="/var/log/omnibot/%programname%.log")
template(name="OmnibotDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="omnibot-docker") {
  # The tag is the container name, which omnibot-instance gives.
  if $programname startswith "omnibot-" then {
    # setup makes /var/log/omnibot for syslog, the user of rsyslogd.
    action(type="omfile" dynaFile="OmnibotDockerFile" template="OmnibotDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/omnibot-docker/dev/log" ruleset="omnibot-docker" createPath="off")
