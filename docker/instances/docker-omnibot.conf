# Docker starts the OmniBot containers when it starts. `omnibot-instance setup` installs this file as
# /etc/systemd/system/docker.service.d/omnibot.conf.
[Unit]
# No container starts without its firewall: when omnibot-firewall fails, Docker does not start.
Requires=omnibot-firewall.service
After=omnibot-firewall.service
# A container with the syslog log driver does not start without the rsyslog socket.
Wants=rsyslog.service
After=rsyslog.service
