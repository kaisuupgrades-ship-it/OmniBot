# OmniBot as a self-hosted server in Docker. See docs/docker.md.
#
#   curl -fsSLO https://updates.omnibot.example.com/docker/compose.yaml
#   curl -fsSLO https://updates.omnibot.example.com/docker/seccomp.json
#   docker compose up -d
#   docker compose exec omnibot omnibot login
services:
  omnibot:
    # Use a version tag to choose when to upgrade. OmniBot never goes back to an older version.
    image: registry.omnibot.example.com/omnibot:latest
    restart: unless-stopped
    security_opt:
      # The Docker default profile, with user namespaces for the Electron sandbox.
      - seccomp=./seccomp.json
      - no-new-privileges:true
    # Chromium uses shared memory. The Docker default of 64 MB is too small.
    shm_size: 1g
    # OmniBot stops its agents and closes the database before it exits.
    stop_grace_period: 60s
    volumes:
      - omnibot-data:/data
    # OmniBot only connects out. It needs no published port.
    # environment:
    #   XAI_API_KEY: ${XAI_API_KEY}

volumes:
  omnibot-data:
